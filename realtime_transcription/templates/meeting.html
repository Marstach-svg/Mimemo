{% extends 'base.html' %}
{% block body %}

<body
    class="min-h-screen bg-gradient-to-tr from-indigo-200 to-purple-100 flex items-center justify-center"
  >
    <div
      class="bg-white shadow-2xl rounded-3xl p-10 w-full max-w-md text-center border border-indigo-100"
    >
      <!-- タイトル -->
      <h1 class="text-4xl font-bold text-indigo-700 mb-4">Meeting</h1>

      <!-- 日本語補足 -->
      <p class="text-sm text-gray-500 mb-8">会議名を入力してください</p>

      <!-- 入力欄 -->
      <input
        type="text"
        placeholder="例: 週次ミーティング"
        class="w-full px-4 py-3 border border-indigo-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 mb-6 text-gray-700"
      />

      <!-- ボタン -->
      <button
        class="w-full py-3 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl font-semibold transition duration-200"
      >
        会議を開始
      </button>
    </div>
  </body>

{% endblock body %}
