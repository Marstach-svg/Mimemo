{% extends 'base.html' %}
{% load static %}

{% block body %}
<body class="min-h-screen bg-gradient-to-tr from-purple-100 to-indigo-300 flex items-center justify-center">
  <div class="bg-white shadow-2xl rounded-3xl p-10 w-full max-w-md text-center border border-indigo-100">
    <!-- タイトル -->
    <h1 class="text-4xl font-bold text-indigo-700 mb-6">Login</h1>

    <!-- 🔽 フォーム開始 -->
    <form method="POST" class="text-left">
      {% csrf_token %}

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-sm text-gray-700 mb-1" for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="your@example.com"
          class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400"
          required
        />
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-sm text-gray-700 mb-1" for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400"
          required
        />
      </div>

      <!-- Login Button -->
      <button
        type="submit"
        class="w-full py-3 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl font-semibold transition duration-200"
      >
        ログイン
      </button>
    </form>
    <!-- 🔼 フォーム終了 -->

    <!-- Signup Link -->
    <p class="mt-6 text-sm text-gray-600 text-center">
      アカウントをお持ちでない方は
      <a href="{% url 'signup' %}" class="text-indigo-600 font-medium hover:underline">新規登録</a>
    </p>
  </div>
</body>
{% endblock body %}
