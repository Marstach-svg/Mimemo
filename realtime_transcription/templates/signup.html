{% extends 'base.html' %}
{% block body %}
    <body class="min-h-screen bg-gradient-to-tr from-purple-300 to-indigo-100 flex items-center justify-center">
        <div class="bg-white shadow-2xl rounded-3xl p-10 w-full max-w-md text-center border border-indigo-100">
            <!-- タイトル -->
            <h1 class="text-4xl font-bold text-indigo-700 mb-6">Signup</h1>

            <!-- Username -->
            <div class="mb-4 text-left">
                <label for="username" class="block text-sm text-gray-700 mb-1">ユーザー名</label>
                <input
                type="text"
                id="username"
                placeholder="ユーザー名"
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400"
                />
            </div>

            <!-- Email -->
            <div class="mb-4 text-left">
                <label for="email" class="block text-sm text-gray-700 mb-1">メールアドレス</label>
                <input
                type="email"
                id="email"
                placeholder="your@example.com"
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400"
                />
            </div>

            <!-- Password -->
            <div class="mb-4 text-left">
                <label for="password" class="block text-sm text-gray-700 mb-1">パスワード</label>
                <input
                type="password"
                id="password"
                placeholder="••••••••"
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400"
                />
            </div>

            <!-- Password Confirm -->
            <div class="mb-6 text-left">
                <label for="confirm-password" class="block text-sm text-gray-700 mb-1">パスワード確認</label>
                <input
                type="password"
                id="confirm-password"
                placeholder="••••••••"
                class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400"
                />
            </div>

            <!-- Signup Button -->
            <button
                class="w-full py-3 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl font-semibold transition duration-200"
            >
                サインアップ
            </button>

            <!-- Login Link -->
            <p class="mt-6 text-sm text-gray-600">
                すでにアカウントをお持ちの方は
                <a href="{% url 'login' %}" class="text-indigo-600 font-medium hover:underline">ログインはこちら</a>
            </p>
        </div>
    </body>
{% endblock body %}
